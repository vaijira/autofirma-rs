[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Jorge Perez Burgos <vaijira@gmail.com>"]
license = "GPL-2.0-only"
repository = "https://github.com/vaijira/autofirma-rs"
rust-version = "1.88"

[workspace.dependencies]
afirma-core = { path = "crates/afirma-core" }

anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"

# Browser
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true
