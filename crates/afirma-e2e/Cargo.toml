[package]
name = "afirma-e2e"
description = "Browser end-to-end tests for autofirma-rs (selenium + thirtyfour)"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dev-dependencies]
# Without default features: `manager` (webdriver auto-download) pulls in `zip` 8, which is
# entirely yanked. The tests connect to an already running webdriver.
thirtyfour = { version = "0.37", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
