[package]
name = "afirma-web"
description = "autofirma-rs browser UI built with dominator"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
afirma-core.workspace = true
anyhow.workspace = true
console_error_panic_hook.workspace = true
dominator = "0.5"
futures = "0.3"
futures-signals = "0.3"
gloo-file = { version = "0.4", features = ["futures"] }
gloo-utils = "0.3"
js-sys.workspace = true
log.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wasm-logger.workspace = true

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "DomRect",
  "Element",
  "File",
  "FileList",
  "Headers",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "MessageEvent",
  "RequestInit",
  "Response",
  "Url",
  "Window",
  "Worker",
  "WorkerOptions",
  "WorkerType",
]
