[package]
name = "afirma-core"
description = "Signature formats, keystores and signing logic for autofirma-rs (no browser dependencies)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# PAdES through `underskrift`. Off by default: underskrift 0.1.4 unconditionally depends on
# `tsp-ltv` (blocking reqwest), which does not build for wasm32-unknown-unknown. Enable it
# once the upstream fix lands (see PLAN.md §4.1).
pades = ["dep:underskrift"]

[dependencies]
log.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true

# RustCrypto, der 0.8 / x509-cert 0.3 generation (the same one p12-keystore uses).
# `cms` 0.3 and `rsa` 0.10 are only available as pre-releases: pin them exactly, since
# pre-releases may break between versions. `cms` must match the version `pkcs12` pins.
base64ct = { version = "1", features = ["alloc"] }
cms = "=0.3.0-pre.1"
const-oid = { version = "0.10", features = ["db"] }
der = { version = "0.8", features = ["alloc", "derive", "oid", "std"] }
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
pkcs8 = "0.11"
rsa = { version = "=0.10.0-rc.19", features = ["encoding"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
signature = "3"
spki = "0.8"
x509-cert = "0.3"
zeroize = "1"

# PKCS#12 (.p12 / .pfx) keystores. `pbes1` adds the legacy RC2/3DES encryption.
p12-keystore = { version = "0.4", features = ["pbes1"] }

# XML canonicalization and transforms for XMLDSig / XAdES / FacturaE / ODF / OOXML.
bergshamra-c14n = "0.10"
bergshamra-transforms = { version = "0.10", default-features = false, features = ["rustcrypto"] }
bergshamra-xml = "0.10"

# PDF signing (PAdES).
underskrift = { version = "0.1", default-features = false, features = ["visual"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Route every `getrandom` generation to `crypto.getRandomValues`.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
